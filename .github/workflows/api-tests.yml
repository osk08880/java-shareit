name: ShareIt API Tests

on:
  pull_request:

jobs:
  # Оставляем reusable для базовой сборки/проверки (если нужно)
  reusable-tests:
    uses: yandex-praktikum/java-shareit/.github/workflows/api-tests.yml@ci

  # Новый custom job: Твой стек с docker-compose + Newman
  docker-tests:
    runs-on: ubuntu-latest
    needs: reusable-tests  # Ждёт базовую сборку
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven and Docker layers
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            gateway/target
            server/target
          key: ${{ runner.os }}-m2-docker-${{ hashFiles('**/pom.xml', '**/Dockerfile') }}

      # Build Maven (для образов)
      - name: Build Maven modules
        run: |
          ./mvnw clean install -DskipTests  # Собирает gateway/server JARs

      # Build Docker images
      - name: Build Docker images
        run: |
          docker build -t shareit-gateway ./gateway
          docker build -t shareit-server ./server

      # Запуск стека (твой docker-compose без ports для CI, но expose gateway)
      - name: Start stack with docker-compose
        run: |
          # Модифицируем compose для CI (ports только для gateway)
          sed 's/ports: - "9090:9090"//g' docker-compose.yml > docker-compose-ci.yml  # Убираем expose server
          cat docker-compose-ci.yml  # Проверяем
          docker-compose -f docker-compose-ci.yml up -d
          # Wait для full ready (healthchecks из твоего compose)
          timeout 120s bash -c '
            until docker-compose -f docker-compose-ci.yml exec gateway curl -f http://localhost:8080/actuator/health; do
              echo "Waiting for stack..."
              sleep 5
              docker-compose -f docker-compose-ci.yml logs -f --tail=10 || true
            done
            echo "Stack ready!"
          ' || (docker-compose -f docker-compose-ci.yml logs && exit 1)
          
          # Логи init
          echo "--- DB logs ---"
          docker-compose -f docker-compose-ci.yml logs db --tail=20
          echo "--- Server logs ---"
          docker-compose -f docker-compose-ci.yml logs server --tail=20
          echo "--- Gateway logs ---"
          docker-compose -f docker-compose-ci.yml logs gateway --tail=20

      - name: Run Newman tests
        run: |
          # Newman бьёт localhost:8080 (gateway exposed)
          newman run ./tests/postman/sprint.json \
            --delay-request 50 \
            -r cli,htmlextra \
            --verbose \
            --color on \
            --reporter-htmlextra-darkTheme \
            --reporter-htmlextra-export reports/shareIt.html \
            --reporter-htmlextra-title "Отчет по тестам" \
            --reporter-htmlextra-logs true \
            --reporter-htmlextra-template ./tests/.github/workflows/dashboard-template.hbs \
            --timeout-request 10000 \
            --timeout-script 30000
          mkdir -p reports && ls -la reports/ || echo "Reports generated?"

      - name: Cleanup stack
        if: always()
        run: |
          docker-compose -f docker-compose-ci.yml down -v  # Clean volumes
          docker system prune -f  # Очистка образов

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shareit-test-results
          path: |
            reports/
            # Для логов: сохраним в txt
            # docker-compose -f docker-compose-ci.yml logs > ci-logs.txt