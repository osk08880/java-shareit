version: '3.9'

services:
  db:
    image: postgres:16.1
    container_name: shareit-db
    ports:
      - "6541:5432"
    environment:
      POSTGRES_USER: shareit
      POSTGRES_PASSWORD: shareit
      POSTGRES_DB: shareit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    image: shareit-server
    container_name: shareit-server
    ports:
      - "9090:9090"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shareit
      SPRING_DATASOURCE_USERNAME: shareit
      SPRING_DATASOURCE_PASSWORD: shareit
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: unless-stopped

  gateway:
    build: ./gateway
    image: shareit-gateway
    container_name: shareit-gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
    environment:
      SHAREIT_SERVER_URL: http://server:9090
    restart: unless-stopped

  newman:
    image: postman/newman
    container_name: shareit-newman
    depends_on:
      - gateway
    volumes:
      - ./postman:/etc/newman
    working_dir: /etc/newman
    networks:
      - default
    command: >
      sh -c "
      # Ждём готовности gateway
      sleep 15 &&
      # Очистка базы перед тестами
      PGPASSWORD=shareit psql -h db -U shareit -d shareit -c 'TRUNCATE TABLE users RESTART IDENTITY CASCADE; TRUNCATE TABLE items RESTART IDENTITY CASCADE; TRUNCATE TABLE bookings RESTART IDENTITY CASCADE;' &&
      # Запуск Newman с твоим sprint.json
      newman run sprint.json
      --delay-request 50
      -r cli,htmlextra
      --color on
      --reporter-htmlextra-export reports/shareIt.html
      --reporter-htmlextra-title 'Отчет по тестам'
      --reporter-htmlextra-logs true
      --environment /etc/newman/postman_environment.json
      "
